[project]
name = "kist-drl-g1-workstation"
version = "0.1.0"
description = "KIST DRL — Unitree G1 PC Workstation Stack (OM1 fork)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core OM1 framework (still used by our mini-runner)
    "json5==0.10.0",
    "jsonschema==4.23.0",
    "pydantic>=2",
    "python-dotenv==1.2.2",
    "aiohttp==3.13.4",
    "nest-asyncio==1.6.0",
    # ROS 2 / DDS transport (CONV-002)
    "pycdr2==1.0.0",
    "eclipse-zenoh==1.4.0",        # OM1 internal loopback only (mode mgr, config provider)
    "cv_bridge==1.13.0.post0",
    # Audio I/O (mic + speaker via STT/TTS providers)
    "soundfile==0.13.1",
    "sounddevice==0.5.2",
    "pyaudio==0.2.14",
    # Vision (camera frames for VLA + GUI)
    "opencv-python==4.11.0.86",
    "pillow==12.2.0",
    "numpy==1.26.4",
    # VLA inference (GR00T N1.7 client side)
    "torch==2.8.0",
    "torchvision==0.23.0",
    # GUI Background streaming
    "py-mjpeg==1.0.1",
    "fastapi==0.135.3",
    "uvicorn==0.34.0",
    "websockets==13.1",
    # Misc
    "matplotlib==3.10.1",
    "om1-modules @ git+https://github.com/OpenMind/om1-modules.git@5a8a633d08c3538f62ceba3dd36d5200c9eb0ca2",
    # LLM Cortex revival prep (CONV-004): OM1 runtime/cortex.py + llm/ still
    # import openai. Kept so the dormant LLM stack continues to import; not
    # called from our run.py path.
    "openai==1.60.1",
    "typer==0.15.1",                # OM1 cli.py / scripts/generate_schema.py
]

[project.optional-dependencies]
dds = [
    "cyclonedds==0.10.2"
]
macos = ["osascript"]

[dependency-groups]
dev = [
    "black==26.3.1",
    "isort==6.0.0",
    "pre-commit==4.1.0",
    "pyright==1.1.408",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.0.0",
    "ruff==0.9.3",
    "vulture==2.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m \"not integration\""
norecursedirs = ["system_hw_test"]
markers = [
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 20
show_missing = true
skip_covered = false

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
exclude = "(.venv)"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
sources = ["src", "tests"]
skip_glob = [".venv*"]

[tool.ruff]
line-length = 120
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["E203", "E501", "D100", "D104", "D200", "D205", "D401", "D404"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"system_hw_test/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.vulture]
exclude = ["system_hw_test/"]
min_confidence = 80
paths = ["src"]
